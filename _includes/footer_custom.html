<script>
  /* Click an image in the page content to view it full size; click anywhere or press Esc to close. */
  (function () {
    var overlay = null;

    function close() {
      if (!overlay) return;
      document.body.removeChild(overlay);
      document.body.classList.remove('lightbox-open');
      overlay = null;
    }

    function open(src, alt, shownWidth) {
      close();
      overlay = document.createElement('div');
      overlay.className = 'lightbox-overlay';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-label', alt || 'Image preview');

      var img = document.createElement('img');
      img.src = src;
      img.alt = alt || '';
      overlay.appendChild(img);

      /* Show the image at its real pixel size on this display (width / devicePixelRatio) so a 2x image is not */
      /* upscaled and stays sharp, but never smaller than it was on the page. It still shrinks to fit the window. */
      function fit() {
        var dpr = window.devicePixelRatio || 1;
        var width = Math.max(img.naturalWidth / dpr, shownWidth || 0);
        img.style.maxWidth = 'min(100%, ' + width + 'px)';
        img.style.maxHeight = 'min(100%, ' + (width * img.naturalHeight / img.naturalWidth) + 'px)';
      }
      img.addEventListener('load', fit);
      if (img.complete && img.naturalWidth) fit();

      overlay.addEventListener('click', close);
      document.body.appendChild(overlay);
      document.body.classList.add('lightbox-open');
    }

    document.addEventListener('click', function (e) {
      var img = e.target;
      if (!img || img.tagName !== 'IMG' || !img.closest('.main-content')) return;
      if (!img.classList.contains('zoomable')) return; /* only images with a larger version to show */
      e.preventDefault();
      open(img.src, img.alt, img.getBoundingClientRect().width); /* src is the 2x file; currentSrc may be the 1x one */
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') close();
    });

    /* Only mark an image zoomable if enlarging it would actually show more: its real pixel size on this display */
    /* (width / devicePixelRatio) must exceed the size it is shown at. Small images get no zoom cursor or lightbox. */
    function markZoomable(img) {
      if (img.closest('a') || !img.naturalWidth) return;
      var dpr = window.devicePixelRatio || 1;
      var larger = img.naturalWidth / dpr > img.getBoundingClientRect().width + 8;
      img.classList.toggle('zoomable', larger);
    }

    function markAll() {
      var images = document.querySelectorAll('.main-content img');
      for (var i = 0; i < images.length; i++) {
        var img = images[i];
        if (img.complete) markZoomable(img);
        else img.addEventListener('load', function () { markZoomable(this); });
      }
    }

    document.addEventListener('DOMContentLoaded', markAll);
    window.addEventListener('resize', markAll);
  })();
</script>
