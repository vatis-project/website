  <script>
    (function () {
      var others = document.querySelectorAll('.download-others a');
      var primary = document.getElementById('download-primary');
      var primaryLabel = document.getElementById('download-primary-label');

      if (!others.length || !primary || !primaryLabel) {
        return;
      }

      function detectPlatform() {
        var ua = navigator.userAgent.toLowerCase();
        var platform = navigator.platform ? navigator.platform.toLowerCase() : '';

        if (platform.indexOf('mac') >= 0 || ua.indexOf('mac os') >= 0) {
          return 'macos';
        }

        if (platform.indexOf('win') >= 0 || ua.indexOf('windows') >= 0) {
          return 'windows';
        }

        if (platform.indexOf('linux') >= 0 || ua.indexOf('linux') >= 0 || ua.indexOf('x11') >= 0) {
          return 'linux';
        }

        return 'windows';
      }

      // The main button downloads for the visitor's platform. The links below it list the other platforms.
      var names = { windows: 'Windows', macos: 'macOS', linux: 'Linux' };
      var detected = detectPlatform();

      others.forEach(function (link) {
        if (link.getAttribute('data-platform') !== detected) {
          return;
        }

        primary.setAttribute('href', link.getAttribute('href'));
        primary.setAttribute('data-platform', detected);
        primaryLabel.textContent = 'Download for ' + names[detected];
        link.hidden = true;
      });
    })();
  </script>
