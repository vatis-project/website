  <script>
    (function () {
      var downloadMenu = document.querySelector('.download-menu');
      var optionLinks = document.querySelectorAll('.download-options a');

      if (!downloadMenu || !optionLinks.length) {
        return;
      }

      function detectPlatform() {
        var ua = navigator.userAgent.toLowerCase();
        var platform = navigator.platform ? navigator.platform.toLowerCase() : '';

        if (platform.indexOf('mac') >= 0 || ua.indexOf('mac os') >= 0) {
          return 'macos';
        }

        if (platform.indexOf('win') >= 0 || ua.indexOf('windows') >= 0) {
          return 'windows';
        }

        if (platform.indexOf('linux') >= 0 || ua.indexOf('linux') >= 0 || ua.indexOf('x11') >= 0) {
          return 'linux';
        }

        return 'windows';
      }

      // Mark the visitor's platform as recommended and list it first.
      var detected = detectPlatform();
      optionLinks.forEach(function (link) {
        if (link.getAttribute('data-platform') !== detected) {
          return;
        }

        link.classList.add('is-recommended');
        var badge = document.createElement('span');
        badge.className = 'download-option-badge';
        badge.textContent = 'Recommended';
        link.appendChild(badge);
        link.parentNode.insertBefore(link, link.parentNode.firstChild);
      });

      optionLinks.forEach(function (link) {
        link.addEventListener('click', function () {
          downloadMenu.removeAttribute('open');
        });
      });

      document.addEventListener('click', function (event) {
        if (downloadMenu.hasAttribute('open') && !downloadMenu.contains(event.target)) {
          downloadMenu.removeAttribute('open');
        }
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && downloadMenu.hasAttribute('open')) {
          downloadMenu.removeAttribute('open');
        }
      });
    })();
  </script>
